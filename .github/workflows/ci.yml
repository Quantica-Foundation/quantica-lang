name: Quantica CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C link-arg=-fuse-ld=lld"   # только для Linux, но безвредно для остальных

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==================== Rust + caching ====================
      - name: Install Rust stable + clippy + fmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust (Swatinem — самый быстрый кэш)
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # ==================== LLVM 18 per OS ====================
      - name: Install LLVM 18 (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main"
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev llvm-18-runtime llvm-18-tools clang-18 libclang-18-dev lld-18
          echo "LLVM_SYS_181_PREFIX=/usr/lib/llvm-18" >> $GITHUB_ENV
          echo "/usr/lib/llvm-18/bin" >> $GITHUB_PATH

      - name: Install LLVM 18 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@18
          echo "LLVM_SYS_181_PREFIX=$(brew --prefix llvm@18)" >> $GITHUB_ENV
          echo "$(brew --prefix llvm@18)/bin" >> $GITHUB_PATH

      - name: Install LLVM 18 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm --version=18.1.8 -y --no-progress
          echo "LLVM_SYS_181_PREFIX=C:\Program Files\LLVM" >> $env:GITHUB_ENV
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      # ==================== Verify LLVM ====================
      - name: Verify LLVM 18
        run: |
          echo "LLVM version:"
          llvm-config --version
          echo "LLVM_SYS_181_PREFIX = $LLVM_SYS_181_PREFIX"

      # ==================== Cargo checks ====================
      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy (strict)
        run: cargo clippy --all-targets --all-features -- -D warnings

      # ==================== Build & Test ====================
      - name: Build release
        run: cargo build --release --verbose

      - name: Run Rust tests
        run: cargo test --verbose

      - name: Run Quantica test suite
        run: cargo run --release -- --test

      - name: Run all .qc examples and tests
        run: |
          echo "=== Running all examples and tests ==="
          for file in examples/*.qc tests/*.qc; do
            if [ -f "$file" ]; then
              echo "→ $file"
              cargo run --release -- "$file" || echo "⚠️  $file failed"
            fi
          done

      # ==================== Artifacts (только на Linux, чтобы не плодить) ====================
      - name: Upload binary artifact (Linux only)
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@v4
        with:
          name: quantica-binary-linux
          path: target/release/quantica
          retention-days: 7
